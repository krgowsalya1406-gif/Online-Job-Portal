<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fc;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#2563eb;
margin-bottom:25px;
}

.section{
margin-top:25px;
}

.section h2{
color:#333;
margin-bottom:15px;
border-bottom:2px solid #2563eb;
padding-bottom:5px;
}

.row{
display:flex;
gap:15px;
margin-bottom:15px;
}

.row input{
flex:1;
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

textarea{
height:100px;
resize:none;
}

.photo{
text-align:center;
margin-bottom:20px;
}

.photo img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:3px solid #2563eb;
margin-bottom:10px;
}

button{
padding:12px 20px;
background:#2563eb;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
margin:10px 5px;
font-size:15px;
}

button:hover{
background:#1d4ed8;
}

.resume{
display:none;
margin-top:40px;
padding:25px;
border:2px solid #2563eb;
border-radius:10px;
}

.resume h2{
color:#2563eb;
margin-bottom:10px;
}

.resume p{
margin:6px 0;
}

</style>

</head>
<body>

<div class="container">

<h1>Resume Builder</h1>

<div class="photo">
<img id="preview" src="https://via.placeholder.com/120">
<br>
<input type="file" id="photo">
</div>

<div class="section">
<h2>Personal Information</h2>

<div class="row">
<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
</div>

<div class="row">
<input type="text" id="phone" placeholder="Phone">
<input type="text" id="location" placeholder="Location">
</div>

<div class="row">
<input type="text" id="linkedin Link" placeholder="LinkedIn Link">
<input type="text" id="github Link" placeholder="GitHub Link">
</div>

</div>

<div class="section">

<h2>Education</h2>

<div class="row">
<input type="text" id="degree" placeholder="Degree">
<input type="text" id="college" placeholder="College">
</div>

<div class="row">
<input type="text" id="branch" placeholder="Branch">
<input type="text" id="cgpa" placeholder="CGPA">
</div>

<input type="text" id="year" placeholder="Passing Year">

</div>

<div class="section">
<h2>Skills</h2>
<textarea id="skills"></textarea>
</div>

<div class="section">
<h2>Projects</h2>
<textarea id="projects"></textarea>
</div>

<div class="section">
<h2>Experience</h2>
<textarea id="experience"></textarea>
</div>

<div class="section">
<h2>Certificates</h2>
<textarea id="certificate"></textarea>
</div>


<button onclick="window.print()">Download PDF</button>

<div class="resume" id="resume">

<h2 id="rname"></h2>

<p id="remail"></p>
<p id="rphone"></p>
<p id="rlocation"></p>
<p id="rlinkedin "></p>
<p id="rgithub "></p>

<hr><br>

<h3>Education</h3>

<p id="reducation"></p>

<h3>Skills</h3>

<p id="rskills"></p>

<h3>Projects</h3>

<p id="rprojects"></p>

<h3>Experience</h3>

<p id="rexperience"></p>

<h3>Certificates</h3>

<p id="rcertificate"></p>

</div>

</div>

<script>

photo.onchange=function(e){

const reader=new FileReader();

reader.onload=function(){

preview.src=reader.result;

}

reader.readAsDataURL(e.target.files[0]);

}

function previewResume(){

resume.style.display="block";

rname.innerHTML=name.value;

remail.innerHTML="<b>Email:</b> "+email.value;

rphone.innerHTML="<b>Phone:</b> "+phone.value;

rlocation.innerHTML="<b>Location:</b> "+location.value;

rlinkedin.innerHTML="<b>LinkedIn Link:</b> "+linkedin .value;

rgithub.innerHTML="<b>GitHub Link:</b> "+github .value;

reducation.innerHTML=
degree.value+"<br>"+
college.value+"<br>"+
branch.value+"<br>"+
"CGPA: "+cgpa.value+"<br>"+
"Passing Year: "+year.value;

rskills.innerHTML=skills.value;

rprojects.innerHTML=projects.value;

rexperience.innerHTML=experience.value;

rcertificate.innerHTML=certificate.value;

}

</script>

</body>
</html>
